workflows:
 gympro-ios:
   name: GYM PRO iOS
   max_build_duration: 120
   instance_type: mac_mini_m2

   environment:
     xcode: latest
     vars:
       XCODE_PROJECT: "GymPro.xcodeproj"
       XCODE_SCHEME: "GymPro"

   scripts:
     - name: Build GYM PRO for iOS
       script: |
         set -e
         xcodebuild build \
           -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
           -scheme "$XCODE_SCHEME" \
           -sdk iphoneos \
           -configuration Debug \
           CODE_SIGN_IDENTITY="" \
           CODE_SIGNING_REQUIRED=NO \
           CODE_SIGNING_ALLOWED=NO

   artifacts:
     - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
     - /tmp/xcodebuild_logs/*.log
